<div id="st_persona_wardrobe_settings" class="st-pw-settings-root" data-extension-id="st-persona-wardrobe">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>User 人设管理</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="st-pw-drawer-card">
                <div class="st-pw-drawer-status-row">
                    <span class="st-pw-drawer-label">当前 User</span>
                    <strong id="st_pw_drawer_active_user">未读取</strong>
                </div>
                <div class="st-pw-drawer-status-row">
                    <span class="st-pw-drawer-label">主世界书</span>
                    <div class="st-pw-drawer-book-actions">
                        <span id="st_pw_drawer_primary_book" class="st-pw-drawer-book-name">未绑定</span>
                        <button id="st_pw_drawer_popup_book_btn" class="menu_button st-pw-mini-btn" type="button">条目</button>
                        <button id="st_pw_drawer_jump_book_btn" class="menu_button st-pw-mini-btn" type="button">跳转</button>
                    </div>
                </div>
                <div class="st-pw-drawer-status-row">
                    <span class="st-pw-drawer-label">扩展项</span>
                    <span id="st_pw_drawer_extra_summary">0 附加书 · 0 随身设定</span>
                </div>
            </div>

            <div class="st-pw-drawer-btn-group">
                <button id="st_pw_open_wardrobe_btn" class="menu_button" type="button">
                    打开 User 人设管理
                </button>
            </div>

            <hr class="sysHR" />

            <div class="st-pw-drawer-toggles">
                <label class="checkbox_label" for="st_pw_enabled">
                    <input id="st_pw_enabled" type="checkbox" />
                    <span>启用随身设定与附加世界书注入</span>
                </label>
                <label class="checkbox_label" for="st_pw_enhance_native">
                    <input id="st_pw_enhance_native" type="checkbox" />
                    <span>在原生 User 面板显示世界书直控条</span>
                </label>
                <label class="checkbox_label" for="st_pw_show_topbar">
                    <input id="st_pw_show_topbar" type="checkbox" />
                    <span>在顶栏显示快捷图标</span>
                </label>
                <label class="checkbox_label" for="st_pw_show_wand">
                    <input id="st_pw_show_wand" type="checkbox" />
                    <span>在魔棒菜单显示入口</span>
                </label>
                <label class="checkbox_label" for="st_pw_auto_switch_char">
                    <input id="st_pw_auto_switch_char" type="checkbox" />
                    <span>切角色聊天时提醒关联 User</span>
                </label>
                <div class="st-pw-drawer-inline-field">
                    <label for="st_pw_scan_depth">关键词扫描最近消息数</label>
                    <input id="st_pw_scan_depth" class="text_pole st-pw-small-input" type="number" min="1" max="50" value="5" />
                </div>
            </div>

            <hr class="sysHR" />

            <div class="st-pw-drawer-footer-btns">
                <button id="st_pw_export_btn" class="menu_button" type="button">导出配置</button>
                <button id="st_pw_import_btn" class="menu_button" type="button">导入配置</button>
                <input id="st_pw_import_file" type="file" accept=".json" style="display:none;" />
            </div>
        </div>
    </div>
</div>
